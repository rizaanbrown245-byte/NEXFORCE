
name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor packages
        run: |
          npm install --legacy-peer-deps --save-exact \
            @capacitor/core@7 \
            @capacitor/android@7
          npm install --legacy-peer-deps --save-dev --save-exact \
            @capacitor/cli@7

      - name: Check Capacitor configuration
        run: |
          if [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.js ] && \
             [ ! -f capacitor.config.json ]; then
            echo "ERROR: Capacitor configuration is missing."
            exit 1
          fi

      - name: Build Web Application
        run: npm run build

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXFORCE-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
