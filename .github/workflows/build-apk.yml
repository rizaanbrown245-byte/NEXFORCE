
name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java version
        run: java -version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Compatible Capacitor Packages
        run: |
          npm install --no-save --legacy-peer-deps \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7

      - name: Verify Capacitor Configuration
        run: |
          if [ ! -f capacitor.config.json ]; then
            echo "ERROR: capacitor.config.json is missing."
            exit 1
          fi

          if [ -f capacitor.config.ts ]; then
            echo "ERROR: Remove capacitor.config.ts."
            exit 1
          fi

          npx cap --version

      - name: Build Web Application
        run: npm run build

      - name: Setup Android Platform
        run: |
          if [ ! -f android/gradlew ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Grant Gradle Execute Permission
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXFORCE-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
